<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wreckfest 2 Server: sign in</title>
<link rel="stylesheet" href="/vendor/visual-assault-themes.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--color-surface); border: 1px solid var(--color-border); border-top: 2px solid var(--color-accent-red); border-radius: 6px; padding: 22px 20px; box-shadow: 0 0 18px var(--color-accent-red); }
  h1 { font-size: 1.15rem; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 0 10px var(--color-text); margin-bottom: 6px; }
  p { color: var(--color-text-muted); font-size: .85rem; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: var(--color-text-muted); margin: 10px 0 3px; }
  input { width: 100%; padding: 8px 10px; font: inherit; background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 4px; }
  input:focus { outline: none; border-color: var(--color-accent-blue); box-shadow: 0 0 8px var(--color-accent-blue); }
  button { width: 100%; margin-top: 16px; font: inherit; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; padding: 9px 18px; border-radius: 4px;
           background: var(--color-primary-action); color: var(--color-accent-green); border: 1px solid var(--color-accent-green); box-shadow: 0 0 10px var(--color-accent-green); }
  button:hover { background: var(--color-primary-action-hover); }
  button:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  #err { margin-top: 12px; color: var(--color-accent-red); font-size: .85rem; min-height: 1.2em; }
</style>
</head>
<body class="neon-theme">
<form class="card" id="f" autocomplete="on">
  <h1>Wreckfest 2 &middot; Server</h1>
  <p>Sign in to manage this server. Your name is written in the activity log next to what you change.</p>
  <label for="name">Your name</label>
  <input id="name" name="username" type="text" maxlength="32" autocomplete="username" required autofocus>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" maxlength="128" autocomplete="current-password" required>
  <button type="submit" id="go">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
'use strict';
const $ = id => document.getElementById(id);
try { $('name').value = localStorage.getItem('wf-name') || ''; if ($('name').value) $('pw').focus(); } catch { /* storage blocked */ }
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = ''; $('go').disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-WF-UI': '1' },
      body: JSON.stringify({ name: $('name').value, password: $('pw').value })
    });
    let data = null; try { data = await res.json(); } catch { /* no body */ }
    if (!res.ok) throw new Error((data && data.error) || res.statusText);
    try { localStorage.setItem('wf-name', data.name); } catch { /* ignore */ }
    location.replace('/');
  } catch (err) { $('err').textContent = err.message; $('pw').select(); }
  $('go').disabled = false;
});
</script>
</body>
</html>
