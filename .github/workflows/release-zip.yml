# The build-and-publish half of a release, shared by auto-release.yml and cut-release.yml (same shape as the
# release-<variant>.yml workflows in KVG_Standards, which have no PowerShell-zip variant yet; to move to one later,
# change the `uses:` line in the two callers). Checks out the tag, runs the checks, builds the zip from the tracked
# files (scripts/package.ps1 refuses personal or game files) and publishes a GitHub release with the zip attached.
name: Release (zip)

on:
  workflow_call:
    inputs:
      version:
        description: 'Tag to release, e.g. v1.2.3 (already created)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Checks
        shell: powershell
        run: .\scripts\test.ps1

      - name: Build the zip
        shell: powershell
        run: .\scripts\package.ps1 -Version "${{ inputs.version }}"

      - name: Release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          1. Download `wf2s-${{ inputs.version }}.zip` below, right-click it, **Extract All**.
          2. Double-click `Start.cmd`. Windows may say "Windows protected your PC" because the file came from the internet:
             click **More info**, then **Run anyway** (the scripts are plain text you can read).
          3. Answer the questions (Steam account name, server name, server password). Windows asks once to open the firewall port.
          4. Set up your router: a static IP for the PC and a forward of **UDP 30100** to it.

          Needs a Windows 10/11 PC and a Steam account that owns Wreckfest 2. The game server downloads from Steam on your PC; it is not part of this zip.
          Updating from an older version: extract over the old folder. Your server lives in `instances\`, which is not in the zip.
          NOTES

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" "dist/wf2s-${{ inputs.version }}.zip" \
            --verify-tag --title "${{ inputs.version }}" --notes-file release-notes.md --generate-notes
