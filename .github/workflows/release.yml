# Manual release: Actions > Release > Run workflow, give a version like 1.2.3.
# Runs the checks, builds the zip from the tracked files (scripts/package.ps1 refuses to ship personal or game files),
# tags the commit and publishes a GitHub release with the zip attached.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. "1.2.3" or "v1.2.3"'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          RAW="${{ inputs.version }}"
          VERSION="v${RAW#v}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$RAW': expected X.Y.Z or vX.Y.Z." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checks
        shell: powershell
        run: .\scripts\test.ps1

      - name: Build the zip
        shell: powershell
        run: .\scripts\package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          1. Download `wf2s-${{ steps.version.outputs.version }}.zip` below, right-click it, **Extract All**.
          2. Double-click `Start.cmd`. Windows may say "Windows protected your PC" because the file came from the internet:
             click **More info**, then **Run anyway** (the scripts are plain text you can read).
          3. Answer the questions (Steam account name, server name, server password). Windows asks once to open the firewall port.
          4. Set up your router: a fixed address for the PC and a forward of **UDP 30100** to it.

          Needs a Windows 10/11 PC and a Steam account that owns Wreckfest 2. The game server downloads from Steam on your PC; it is not part of this zip.
          Updating from an older version: extract over the old folder. Your server lives in `instances\`, which is not in the zip.
          NOTES

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" "dist/wf2s-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.version }}" --notes-file release-notes.md --generate-notes
